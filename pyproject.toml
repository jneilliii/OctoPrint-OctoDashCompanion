[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoDash-Companion"
version = "0.0.7"
description = "Plugin that allows editing of some configuration settings for OctoDash, specifically Custom Actions."
authors = [
    { name = "jneilliii", email = "jneilliii+github@gmail.com" },
]
requires-python = ">=3.3,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
octodashcompanion = "octoprint_octodashcompanion"

[project.urls]
Homepage = "https://github.com/jneilliii/OctoPrint-OctoDashCompanion"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_octodashcompanion",
    "octoprint_octodashcompanion.*",
]
